<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" fill="none">
  <defs>
    <linearGradient id="installerBg" x1="0" y1="0" x2="600" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="installerTeal" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <radialGradient id="mesh" cx="500" cy="80" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="320" fill="url(#installerBg)" />
  <rect width="600" height="320" fill="url(#mesh)" />
  
  <!-- Subtle Grid Accent -->
  <g stroke="#334155" stroke-opacity="0.2" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="150" y1="0" x2="150" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="450" y1="0" x2="450" y2="320" />
  </g>

  <!-- Hard Monogram Shield -->
  <g transform="translate(60, 60)">
    <rect width="88" height="88" rx="20" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <g transform="translate(18, 18) scale(0.6)">
      <rect x="10" y="8" width="22" height="72" rx="5" fill="url(#installerTeal)" />
      <rect x="56" y="8" width="22" height="72" rx="5" fill="url(#installerTeal)" />
      <rect x="32" y="34" width="24" height="18" fill="#5eead4" />
    </g>
  </g>

  <!-- Title & Typography -->
  <text x="172" y="105" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">HARD</text>
  <text x="174" y="132" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Clean, optimize, and understand your Windows PC.</text>

  <!-- Trust Badges & Features -->
  <g transform="translate(60, 190)">
    <rect width="480" height="88" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    
    <text x="24" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#2dd4bf">CORE ARCHITECTURE</text>
    <text x="24" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">· Review-Before-Delete Policy with Dry Run validation</text>
    <text x="24" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">· Recycle Bin fallback · Protected Windows system paths · Mole CLI bridge</text>

    <text x="320" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">TARGET SYSTEM</text>
    <text x="320" y="50" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#f1f5f9">Windows 10 / 11</text>
    <text x="320" y="68" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="400" fill="#64748b">x64 &amp; ARM64 Native</text>
  </g>
</svg>
